name: job Level Env Example

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      CITY: vijayawada
      COUNTRY: India
    steps:
    - name: Step level example

      run: |
        echo "City is $CITY"
        echo "Country is $COUNTRY"

    - name: Next step
      run: echo "City is $CITY and Country is $COUNTRY"

  demo1:
   runs-on: ubuntu-latest
   steps:
    - name: teststep
      run: echo "Country is $COUNTRY and City is $CITY"
