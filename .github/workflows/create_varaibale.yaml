name: Step-level,job level and repo level

on:
    workflow_dispatch:

jobs:
    demo:
    runs-on: ubuntu-latest

    steps:
    - name: step level example
        env: CITY=Vijayawada
            TRAINER=jay

        run: |
            echo "City is:$CITY" 
            echo "Trainer is:$TRAINER"

    - name: Next Step
        run: echo "City is $CITY and Trainer is $TRAINER"
